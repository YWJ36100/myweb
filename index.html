<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>奶蛙使用 WorkBuddy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fff7e6 0%, #ffe3b3 40%, #ffd6a5 100%);
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(255, 160, 60, 0.25);
      padding: 32px;
      max-width: 960px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      color: #e07a1f;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 1rem;
      color: #a86a2b;
      margin-bottom: 24px;
    }

    .image-wrap {
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      line-height: 0;
    }

    .image-wrap img {
      width: 100%;
      height: auto;
      display: block;
    }

    .footer {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #c98a45;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🐸 奶蛙使用 WorkBuddy</h1>
    <p class="subtitle">奶蛙正在用 WorkBuddy 快乐工作的一天～</p>
    <div class="image-wrap">
      <img src="assets/workbuddy_frog_v1.png" alt="奶蛙使用 WorkBuddy 的画面">
    </div>
    <p class="footer">Made with ❤️ · 奶蛙 × WorkBuddy</p>
  </div>
</body>
</html>
